# Builds the kernel and image natively on GitHub's arm64 runners, pushes them
# to Cachix, and attaches the image to a release for v* tags.
# Needs the CACHIX_AUTH_TOKEN repository secret (Write token). Untested: expect to tune
# disk space (the kernel build needs several GB) on the first runs.
name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: cseelhoff-opi5ultra
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build kernel
        run: nix build -L .#kernel
      - name: Build image
        run: nix build -L .#sdImage
      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: result/sd-image/*.img.zst
